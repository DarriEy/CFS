# CFS Provider Inventory
# Total providers: 26 — 24 live-verified + 2 offline/access-gated.
# Salvaged batch: aorc_nwm + era5_cds (new, live-verified); gpm Early/Late + hrrr
# sfc_fcst products added; narr +dswrf/dlwrf radiation (live-verified).
# Offline/blocked: mswep (rclone), em_earth (AWS creds).
#
# Canonical schema: cfs.core.vocabulary (canonical-v1)
# Connectors return a bbox+time subset as a canonical xarray.Dataset and STOP.
# HRU remapping and model-specific forcing schemas are the consumer's job.

- slug: era5_arco
  name: ECMWF ERA5 (ARCO / Google Cloud)
  protocol: zarr
  base_url: gs://gcp-public-data-arco-era5/ar/full_37-1h-0p25deg-chunk-1.zarr-v3
  resolution_deg: 0.25
  grid: regular
  auth: anonymous
  bbox: [-180.0, -90.0, 180.0, 90.0]
  temporal_resolution: hourly
  license: "Copernicus / ECMWF licence (free, attribution)"
  citation: "Hersbach et al. (2020), ERA5; ARCO-ERA5, Google/ECMWF."
  products: 1
  canonical_variables:
    - air_temperature
    - dewpoint_temperature
    - eastward_wind
    - northward_wind
    - surface_air_pressure
    - precipitation_flux
    - surface_downwelling_shortwave_flux
    - surface_downwelling_longwave_flux
  status: implemented

