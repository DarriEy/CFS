- slug: carra
  name: CARRA — Copernicus Arctic Regional Reanalysis (2.5 km, via CDS)
  protocol: cds_api
  base_url: https://cds.climate.copernicus.eu/api
  resolution_deg: 0.025
  grid: regular            # interpolated to 0.025° via CDS grid param
  auth: cds_api
  bbox: [-180.0, 55.0, 180.0, 90.0]
  temporal_resolution: 3hourly
  domain: west_domain      # or east_domain via config={'domain': ...}
  license: "Copernicus / ECMWF licence (free, attribution; accept on CDS)."
  citation: "C3S, CARRA — Arctic Regional Reanalysis."
  products: 1
  canonical_variables:
    - air_temperature
    - eastward_wind
    - northward_wind
    - surface_air_pressure
    - specific_humidity                     # DERIVED from 2m RH (Bolton/Magnus)
    - precipitation_flux                    # forecast stream, 1-h accum -> /3600
    - surface_downwelling_shortwave_flux    # forecast stream -> /3600
    - surface_downwelling_longwave_flux     # forecast stream -> /3600
  note: "Dual analysis+forecast streams merged; RH->q derived. LIVE-VERIFIED (Greenland west_domain; T 276K, q 0.0024 derived, QC clean). CDS request limited to requested day-range (not whole month)."
  status: implemented

