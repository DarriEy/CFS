- slug: gefs
  name: NOAA GEFS ensemble forecast (0.25 select, 3-hourly, global, via S3 GRIB2)
  protocol: http
  base_url: https://noaa-gefs-pds.s3.amazonaws.com
  resolution_deg: 0.25
  grid: regular            # 0-360 longitude, normalized on subset
  auth: anonymous
  bbox: [-180.0, -90.0, 180.0, 90.0]
  temporal_resolution: 3hourly
  variant: "config knob members (default control gec00 + gep01..gep30 = 31)"
  license: "U.S. Government work / NOAA Open Data (public domain)"
  citation: "NOAA NCEP Global Ensemble Forecast System (GEFS)."
  products: 1
  canonical_variables:
    - air_temperature       # TMP 2 m (instantaneous, identity K)
    - surface_air_pressure  # PRES surface
    - eastward_wind         # UGRD 10 m
    - northward_wind        # VGRD 10 m
    - precipitation_flux    # APCP surface, bucket-de-accumulated -> kg m-2 s-1
    - surface_downwelling_shortwave_flux  # DSWRF surface, bucket-de-averaged
    - surface_downwelling_longwave_flux   # DLWRF surface, bucket-de-averaged
    - specific_humidity     # derived from 2 m RH + T + surface pressure (Bolton 1980)
  note: "Ensemble companion to gfs (same .idx/byte-range/cfgrib machinery), pgrb2sp25 select product (3-hourly to f240), returns a member dim. Instantaneous fields identity SI; precip (APCP, accumulation) + radiation (DSWRF/DLWRF, average) ship as 6-hour buckets (0-3,0-6,6-9,...) DE-BUCKETED by lead hour (cur-prev for acc, 2*cur-prev for ave) -> APCP to flux, radiation W m-2; value-sign reset detection unsafe here. specific_humidity DERIVED from 2 m RH + T + surface pressure (RH fetched as input only, never exposed raw). LIVE-VERIFIED (precip non-negative 0-9 mm/hr, SW ~0 overnight after de-averaging, derived q 9-17 g/kg, member spread)."
  status: implemented
  verified: true

