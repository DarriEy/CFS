# CFS Provider Inventory
# Total providers: 33 — 31 live-verified + 2 offline/access-gated.
# Forecasts: gfs (deterministic) + gefs (ensemble, member dim) via S3 GRIB2
# byte-range + cfgrib. gefs exposes instantaneous fields plus bucket-de-accumulated
# precip + down shortwave/longwave radiation, and specific humidity derived from RH.
# Offline/blocked: mswep (rclone), em_earth (AWS creds).
#
# verified: true = live-verified against the upstream store (auth-gated ones with
# real credentials); false = offline-verified only (logic tested, live access pending).
# caveats: machine-readable per-provider warnings (rolling archive windows,
# unverified units, slow per-file access paths).
#
# Canonical schema: cfs.core.vocabulary (canonical-v1)
# Connectors return a bbox+time subset as a canonical xarray.Dataset and STOP.
# HRU remapping and model-specific forcing schemas are the consumer's job.

