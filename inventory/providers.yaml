- slug: era5_land
  name: ECMWF ERA5-Land (0.1°, hourly, via CDS)
  protocol: cds_api
  base_url: https://cds.climate.copernicus.eu/api
  resolution_deg: 0.1
  grid: regular
  auth: cds_api  # ~/.cdsapirc or CDSAPI_URL/CDSAPI_KEY
  bbox: [-180.0, -90.0, 180.0, 90.0]
  temporal_resolution: hourly
  license: "Copernicus / ECMWF licence (free, attribution; accept on CDS)."
  citation: "Muñoz-Sabater et al. (2021), ERA5-Land, ESSD 13:4349-4383."
  products: 1
  canonical_variables:
    - air_temperature
    - dewpoint_temperature
    - surface_air_pressure
    - eastward_wind
    - northward_wind
    - precipitation_flux                    # daily-reset accumulation -> de-accumulated
    - surface_downwelling_shortwave_flux    # de-accumulated
    - surface_downwelling_longwave_flux     # de-accumulated
  note: "CDS area param does the spatial subset; tp/ssrd/strd de-accumulated. LIVE-VERIFIED (1h chunk-pad fixes the 00:00 daily-total de-accum edge case; SW 664 W/m2, QC clean)."
  status: implemented

