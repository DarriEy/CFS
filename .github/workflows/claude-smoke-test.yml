name: Claude Smoke Test

# Verifies the ANTHROPIC_API_KEY secret + claude-code-action wiring.
# Lives only on the chore/claude-smoke-test branch; safe to delete once verified.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Anthropic API key (no secret is printed)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "raw key length: ${#ANTHROPIC_API_KEY}, prefix: ${ANTHROPIC_API_KEY:0:7}..."
          TRIMMED="$(printf '%s' "$ANTHROPIC_API_KEY" | tr -d '[:space:]')"
          echo "trimmed key length: ${#TRIMMED}"
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" https://api.anthropic.com/v1/messages \
            -H "x-api-key: $TRIMMED" \
            -H "anthropic-version: 2023-06-01" \
            -H "content-type: application/json" \
            -d '{"model":"claude-sonnet-4-6","max_tokens":16,"messages":[{"role":"user","content":"ping"}]}')
          echo "HTTP status: $code"
          echo "--- response body ---"
          cat /tmp/resp.json
          echo
          test "$code" = "200"
