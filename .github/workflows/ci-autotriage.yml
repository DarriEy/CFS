name: CI Auto-Triage

# When the CI workflow finishes red, an automated Claude agent investigates the
# failure, posts a report, and — only for adapter/data drift — opens a fix PR.
# See .github/claude-triage-guide.md for the classification rules and contract.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# One triage at a time per branch; let an in-flight triage finish.
concurrency:
  group: ci-autotriage-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  triage:
    # Only on a red CI run, and never recurse on our own autofix branches.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'failure' &&
          !startsWith(github.event.workflow_run.head_branch, 'claude/autofix/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.ANTHROPIC_API_KEY_OAUTH }}
          show_full_output: "true"
          prompt: |
            You are an automated CI triage agent. Be careful, minimal, and honest —
            you are operating unattended on a real repository.

            Failure context (from the triggering event):
            - Repository:    ${{ github.repository }}
            - Failed run:    "${{ github.event.workflow_run.name }}" (id ${{ github.event.workflow_run.id }})
            - Head branch:   ${{ github.event.workflow_run.head_branch }}
            - Head SHA:      ${{ github.event.workflow_run.head_sha }}
            - Trigger event: ${{ github.event.workflow_run.event }}
            - Run URL:       ${{ github.event.workflow_run.html_url }}

            Do these in order:

            1. Read `.github/claude-triage-guide.md` in this repo and follow it. It defines this
               service's canonical contract and the classification rules.

            2. Fetch the failure logs and find the precise root cause (file, test, error type):
               `gh run view ${{ github.event.workflow_run.id }} --repo ${{ github.repository }} --log-failed`

            3. Classify the failure into exactly one of:
               outage | adapter_drift | data_drift | contract_change | real_bug | other

            4. ALWAYS post a concise markdown report (root cause, classification + why, proposed
               action). If the failing commit belongs to an open PR, comment on that PR; otherwise
               post a commit comment via:
               `gh api repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }}/comments -f body=@<file>`
               Title the report "🤖 CI triage: <classification>".

            5. Act on the classification:
               - adapter_drift OR data_drift: create branch
                 `claude/autofix/${{ github.event.workflow_run.id }}`, make the MINIMAL fix
                 (adapter/fixture code only — NEVER anything under src/cfs/core/), commit, push,
                 and open a PR with `gh pr create --label claude-autofix --label automerge-on-green`.
                 Reference the failing run in the body and explain the diff.
               - contract_change: create the same branch, open a PR with your best proposed fix,
                 but label it `--label claude-autofix --label needs-human-review` (NOT
                 automerge-on-green). Explain why a human must decide.
               - outage / real_bug / other: DO NOT open a fix PR. The report is the deliverable.
                 For outage, recommend a re-run. For real_bug, describe the fix for a human.

            Hard rules:
            - Never modify files under src/cfs/core/ as part of a drift autofix. If the fix needs
              that, it is a contract_change.
            - Keep changes minimal and scoped to the root cause. No drive-by refactors.
            - Never disable, skip, or weaken tests (or deselect via the network marker) to go green.
              Fix the cause or classify honestly.
            - If you are not confident, classify as `other` and report only.
            - If `gh pr create --label X` fails because a label is missing, create it with
              `gh label create X` and retry.
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 40
            --allowedTools Bash,Read,Edit,Write,Grep,Glob
