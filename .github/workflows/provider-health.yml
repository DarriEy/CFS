name: Provider health

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: cfs-provider-health
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sentinels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        # cfs.health itself is stdlib-only, but `python -m cfs.health` imports
        # the cfs package __init__, which needs the core dependencies.
        run: pip install -e .
      - name: Run credential-free protocol sentinels
        id: health
        continue-on-error: true
        run: |
          set -o pipefail
          python -m cfs.health | tee provider-health.tmp.json
          mv provider-health.tmp.json provider-health.json
      - name: Publish summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report_path = Path("provider-health.json")
          try:
              report = json.loads(report_path.read_text())
          except (OSError, json.JSONDecodeError) as exc:
              Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("## CFS provider health\n\nReport generation failed: " + str(exc) + "\n")
              raise SystemExit(0)
          lines = ["## CFS provider health", "", "| Protocol | Sentinel | Result |", "|---|---|---|"]
          for check in report["checks"]:
              result = f"OK ({check['status']})" if check["ok"] else f"FAILED ({check['error']})"
              lines.append(f"| {check['protocol']} | {check['name']} | {result} |")
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines) + "\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: provider-health
          path: provider-health.json
          if-no-files-found: warn
      - name: Fail when a protocol sentinel is unavailable
        if: always()
        env:
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
        run: |
          if [ "$HEALTH_OUTCOME" != "success" ]; then
            echo "Provider health command failed (outcome: $HEALTH_OUTCOME)."
            exit 1
          fi
