[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cfs"
version = "0.1.0"
description = "Community Forcing Service — acquire-and-subset access to meteorological forcing for hydrological models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "CFS Contributors" },
]
keywords = ["hydrology", "forcing", "meteorology", "reanalysis", "era5", "xarray", "zarr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "tenacity>=8.0",
    "numpy>=1.26",
    "requests>=2.31",
]

[project.optional-dependencies]
climate = [
    "xarray>=2024.0",
    "zarr>=2.18",
    "fsspec>=2024.0",
    "aiohttp>=3.9",
    "gcsfs>=2024.0",
    "s3fs>=2024.0",
    "dask>=2024.0",
    "netcdf4>=1.6",
    "h5netcdf>=1.3",
    "h5py>=3.10",
]
cds = [
    "cdsapi>=0.7.2",
]
earthdata = [
    "pydap>=3.4",
    "pandas>=2.0",
    "pyproj>=3.6",
]
forecast = [
    "cfgrib>=0.9.10",
    "eccodes>=1.6",
    "pandas>=2.0",
]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
cfs = "cfs.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/cfs"]

[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# Tests gate heavy deps behind `xr = pytest.importorskip(...)` before importing
# cfs modules, which is deliberate — exempt them from the import-position rule.
"tests/**" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "network: tests requiring network access (deselect with '-m not network')",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
disallow_untyped_defs = false
check_untyped_defs = true
