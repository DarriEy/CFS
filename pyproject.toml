[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "community-forcing-service"
dynamic = ["version"]
description = "Community Forcing Service — acquire-and-subset access to meteorological forcing for hydrological models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Darri Eythorsson", email = "dae5@hi.is" },
]
keywords = ["hydrology", "forcing", "meteorology", "reanalysis", "era5", "xarray", "zarr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "tenacity>=8.0",
    "numpy>=1.26",
    "requests>=2.31",
]

[project.optional-dependencies]
climate = [
    "xarray>=2024.0",
    "zarr>=2.18",
    "fsspec>=2024.0",
    "aiohttp>=3.9",
    "gcsfs>=2024.0",
    "s3fs>=2024.0",
    "dask>=2024.0",
    "netcdf4>=1.6",
    "h5netcdf>=1.3",
    "h5py>=3.10",
]
cds = [
    "cdsapi>=0.7.2",
]
earthdata = [
    "pydap>=3.4",
    "pandas>=2.0",
    "pyproj>=3.6",
]
forecast = [
    "cfgrib>=0.9.10",
    "eccodes>=1.6",
    "pandas>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pandas-stubs>=2.0",
    "types-PyYAML>=6.0",
    "types-requests>=2.31",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[project.urls]
Homepage = "https://github.com/DarriEy/CFS"
Documentation = "https://darriey.github.io/CFS/"
Repository = "https://github.com/DarriEy/CFS"
Issues = "https://github.com/DarriEy/CFS/issues"
Changelog = "https://github.com/DarriEy/CFS/blob/main/CHANGELOG.md"

[project.scripts]
cfs = "cfs.cli.main:cli"

# SYMFLUENCE auto-discovers this on `import symfluence` and calls the zero-arg
# register(), which adds the CFS acquisition + dataset handlers. SYMFLUENCE is
# deliberately NOT a dependency (not even optional): the plugin only activates
# when SYMFLUENCE is installed and imports this entry point itself.
[project.entry-points."symfluence.plugins"]
cfs = "cfs.integrations.symfluence:register"

[tool.hatch.version]
path = "src/cfs/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cfs"]

[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# Tests gate heavy deps behind `xr = pytest.importorskip(...)` before importing
# cfs modules, which is deliberate — exempt them from the import-position rule.
"tests/**" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "network: tests requiring network access (deselect with '-m not network')",
]

[tool.coverage.report]
# Keep CI from silently accepting material coverage regressions. The current
# offline suite reports about 55%; this intentionally tight ratchet makes
# coverage an enforced contract while retaining roughly one point of margin.
fail_under = 54

[tool.mypy]
# Target 3.12 so mypy can parse the PEP 695 `type` statement that numpy's 2.x
# bundled stubs use (it rejects that syntax under a <3.12 target, which broke the
# 3.12/3.13 CI legs). Runtime support stays at >=3.11; the codebase itself uses
# no 3.12-only syntax.
python_version = "3.12"
warn_return_any = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
# Untyped third-party libraries (no stubs, no py.typed marker).
module = [
    "cdsapi.*",
    "pydap.*",
    "fsspec.*",
    "gcsfs.*",
    "s3fs.*",
    "cfgrib.*",
    "geopandas.*",
    "shapely.*",
    "pandas",
    "pandas.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# SYMFLUENCE is an optional host framework (entry-point plugin target), never
# a dependency — it is absent in CI, and the integration module imports it
# defensively.
module = ["symfluence.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# zarr ships py.typed but uses PEP 695 type-parameter syntax, which mypy
# cannot parse under python_version = 3.11 — don't follow imports into it.
module = "zarr.*"
follow_imports = "skip"
ignore_missing_imports = true
